<!-- ================================================================================== -->
<!-- WIDGET. 프롬프트 복사기 (Prompt Copier) -->
<!-- 이 부분을 복사해서 노션에 임베드하세요 -->
<!-- ================================================================================== -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프롬프트 복사기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 40px 16px 48px; font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; }
        .prompt-body { white-space: pre-wrap; word-break: break-word; }
        /* 복사 완료 시 살짝 눌리는 느낌 */
        .copied { animation: pop 0.3s ease; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(0.94); } 100% { transform: scale(1); } }
        /* 토스트 */
        #toast { transition: opacity 0.3s, transform 0.3s; }
    </style>
</head>
<body>
    <div class="max-w-2xl mx-auto text-white">

        <!-- 헤더 -->
        <div class="text-center mb-8">
            <span class="text-indigo-400 font-bold tracking-widest text-xs">PROMPT COPIER</span>
            <h1 class="text-2xl md:text-3xl font-black mt-2 mb-3">복사해서 바로 쓰는 프롬프트</h1>
            <p class="text-gray-400 text-sm font-light">
                버튼 하나로 프롬프트를 복사하고, AI 챗봇에 붙여넣어 보세요.
            </p>
        </div>

        <!-- 프롬프트 카드 목록 -->
        <div id="cards" class="space-y-5"></div>

        <p class="text-center text-gray-600 text-xs mt-10">
            프롬프트를 복사해 ChatGPT · Claude · Gemini 등에 붙여넣으세요.
        </p>
    </div>

    <!-- 복사 완료 토스트 -->
    <div id="toast" class="fixed left-1/2 bottom-6 -translate-x-1/2 translate-y-4 opacity-0 pointer-events-none
                bg-indigo-500 text-white text-sm font-bold px-5 py-3 rounded-full shadow-lg z-50">
        <i class="fa-solid fa-check mr-1"></i> 복사되었어요!
    </div>

    <script>
        // ================= 프롬프트 데이터 =================
        const PROMPTS = [
            {
                num: "③",
                icon: "fa-align-left",
                title: "요약 챗봇",
                subtitle: "긴 글·회의 내용을 핵심만 뽑아주는 도우미",
                test: "이 회의 내용 요약해줘: [내용]",
                text:
`너는 긴 글을 핵심만 뽑아주는 요약 도우미야.
[역할] 사용자가 준 내용을 짧고 명확하게 요약해.
[해야 할 일]
- 핵심 3가지로 요약하고, 맨 아래 '한 줄 결론'을 붙여.
- 전문용어는 쉬운 말로 풀어.
[규칙] 없는 내용은 지어내지 마. 개인정보는 A씨로 바꿔.
[말투] 간결하고 담백하게.`
            },
            {
                num: "④",
                icon: "fa-wand-magic-sparkles",
                title: "말투 변환 챗봇",
                subtitle: "같은 내용을 상황에 맞는 말투로 바꿔주는 도우미",
                test: "이 문자를 보호자용 정중한 안내문으로 바꿔줘: [문장]",
                text:
`너는 문장의 말투를 바꿔주는 도우미야.
[역할] 뜻은 그대로 두고, 요청한 말투로 다시 써줘.
[해야 할 일]
- '정중하게 / 부드럽게 / 공지문체 / 안내문체' 중 요청한 톤으로 변환.
- 대상(보호자·동료·기관 등)에 맞게 표현을 조정.
[규칙] 의미를 바꾸거나 내용을 더하지 마. 개인정보는 A씨로.
[말투] 친절한 편집자 느낌.`
            },
            {
                num: "⑤",
                icon: "fa-lightbulb",
                title: "아이디어·기획 챗봇",
                subtitle: "프로그램·행사 아이디어를 던져주는 도우미",
                test: "지역주민 대상 스트레스 관리 행사 아이디어 줘",
                text:
`너는 아이디어를 도와주는 기획 도우미야.
[역할] 주제를 주면 실현 가능한 아이디어를 다양하게 제안해.
[해야 할 일]
- 아이디어 8~10개를 한 줄 설명과 함께 제시.
- 그중 실현 가능성 높은 3개를 골라 이유를 붙여.
- 내가 놓친 관점이 있으면 질문으로 되물어.
[규칙] 예산·대상이 불명확하면 먼저 물어봐.
[말투] 밝고 적극적으로.`
            },
            {
                num: "⑥",
                icon: "fa-graduation-cap",
                title: "쉽게 풀어주는 설명 챗봇",
                subtitle: "어려운 개념·용어를 쉽게 설명해주는 도우미",
                test: "'사례관리'가 뭔지 쉽게 설명해줘",
                text:
`너는 어려운 내용을 쉽게 풀어주는 설명 도우미야.
[역할] 전문용어나 복잡한 개념을 누구나 알게 설명해.
[해야 할 일]
- 먼저 한 문장 정의 → 그다음 일상 비유나 예시.
- 필요하면 '이것만 기억하세요' 한 줄로 마무리.
[규칙] 확실하지 않은 건 '확인이 필요하다'고 말해.
[말투] 친근하고 쉽게, 초등학생도 알 수 있게.`
            },
            {
                num: "⑦",
                icon: "fa-list-check",
                title: "체크리스트 챗봇",
                subtitle: "업무·행사 준비물을 빠짐없이 정리해주는 도우미",
                test: "생명존중 교육 행사 준비 체크리스트 만들어줘",
                text:
`너는 준비사항을 정리해주는 체크리스트 도우미야.
[역할] 어떤 일을 하는지 물어보고, 필요한 준비 항목을 체크리스트로 만들어.
[해야 할 일]
- 준비물·해야 할 일을 단계별(사전/당일/사후)로 정리.
- 각 항목 앞에 ☐ 표시, 빠지기 쉬운 것도 짚어줘.
[규칙] 상황이 불명확하면 한 가지만 먼저 질문.
[말투] 꼼꼼하고 든든하게.`
            },
            {
                num: "⑧",
                icon: "fa-envelope",
                title: "이메일·공문 초안 챗봇",
                subtitle: "상황만 말하면 격식 있는 초안을 잡아주는 도우미",
                test: "협력기관에 합동회의 일정 조율하는 메일 초안 써줘",
                text:
`너는 업무 이메일·공문 초안을 잡아주는 도우미야.
[역할] 사용자가 상황을 말하면, 바로 보낼 수 있는 초안을 써줘.
[해야 할 일]
- 제목·인사·본문·맺음말 형식으로 작성.
- 받는 대상(협력기관·상급기관·주민 등)에 맞춰 격식을 조절.
[규칙] 받는 사람·목적이 불명확하면 한 가지만 먼저 물어봐.
       개인정보는 A씨로, 없는 사실은 지어내지 마.
[말투] 정중하고 간결하게.`
            },
            {
                num: "⑨",
                icon: "fa-comments",
                title: "역질문 코치 챗봇",
                subtitle: "뭘 물어야 할지 모를 때, AI가 먼저 질문해주는 도우미",
                test: "보고서를 써야 하는데 뭘 알려줘야 할지 모르겠어",
                text:
`너는 사용자의 요청을 구체화해주는 질문 코치야.
[역할] 사용자가 막연하게 요청하면, 좋은 결과를 위해 필요한 정보를
       네가 먼저 하나씩 질문해서 채워줘.
[해야 할 일]
- 한 번에 하나씩 질문해(목적·대상·형식·분량·조건 순).
- 답이 모이면, 그 내용을 정리한 '완성 프롬프트'를 만들어줘.
[규칙] 질문은 짧고 쉽게. 사용자가 답하기 편하게 예시도 살짝 붙여.
[말투] 친절하고 차분하게, 하나씩 이끌어주듯.`
            }
        ];

        // ================= 카드 렌더링 =================
        function esc(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        const wrap = document.getElementById("cards");
        wrap.innerHTML = PROMPTS.map((p, i) => `
            <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
                <!-- 카드 헤더 -->
                <div class="flex items-start gap-3 p-4 md:p-5">
                    <div class="shrink-0 w-11 h-11 rounded-xl bg-indigo-500/20 text-indigo-300 flex items-center justify-center">
                        <i class="fa-solid ${p.icon} text-lg"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <h3 class="font-bold text-base leading-snug">
                            <span class="text-indigo-400 mr-1">${p.num}</span>${esc(p.title)}
                        </h3>
                        <p class="text-gray-400 text-xs mt-0.5">${esc(p.subtitle)}</p>
                    </div>
                    <button data-idx="${i}"
                        class="copy-btn shrink-0 bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700
                               text-white text-xs font-bold px-3.5 py-2 rounded-lg transition-colors flex items-center gap-1.5">
                        <i class="fa-regular fa-copy"></i><span class="btn-label">복사</span>
                    </button>
                </div>

                <!-- 프롬프트 본문 -->
                <div class="px-4 md:px-5 pb-4">
                    <pre class="prompt-body bg-slate-900/70 border border-slate-700 rounded-xl p-4
                                text-gray-200 text-[13px] leading-relaxed font-sans">${esc(p.text)}</pre>
                    <div class="flex items-center gap-2 mt-3 text-xs text-gray-500">
                        <i class="fa-solid fa-flask text-amber-400/80"></i>
                        <span>테스트: <span class="text-gray-400">${esc(p.test)}</span></span>
                    </div>
                </div>
            </div>
        `).join("");

        // ================= 복사 로직 =================
        const toast = document.getElementById("toast");
        let toastTimer = null;

        function showToast() {
            toast.style.opacity = "1";
            toast.style.transform = "translate(-50%, 0)";
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translate(-50%, 16px)";
            }, 1600);
        }

        async function copyText(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) { /* 폴백으로 진행 */ }
            // 폴백: 임시 textarea + execCommand
            try {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.top = "-9999px";
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand("copy");
                document.body.removeChild(ta);
                return ok;
            } catch (e) {
                return false;
            }
        }

        wrap.addEventListener("click", async (e) => {
            const btn = e.target.closest(".copy-btn");
            if (!btn) return;
            const idx = +btn.dataset.idx;
            const ok = await copyText(PROMPTS[idx].text);
            const label = btn.querySelector(".btn-label");
            const icon = btn.querySelector("i");
            if (ok) {
                btn.classList.add("copied");
                setTimeout(() => btn.classList.remove("copied"), 300);
                label.textContent = "완료";
                icon.className = "fa-solid fa-check";
                showToast();
                setTimeout(() => {
                    label.textContent = "복사";
                    icon.className = "fa-regular fa-copy";
                }, 1600);
            } else {
                label.textContent = "실패";
                setTimeout(() => { label.textContent = "복사"; }, 1600);
            }
        });
    </script>
</body>
</html>

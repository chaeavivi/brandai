<style>
:root{--navy:#0d1b2e;--navy2:#13263f;--teal:#139a8c;--teal2:#3fd3c1;--tl:#e6f5f3;--bg:#f4f7fa;--card:#fff;--line:#dbe3ec;--ink:#16202c;--sub:#55657a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{font-family:"Noto Sans KR","Noto Sans CJK KR",-apple-system,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;padding-bottom:calc(84px + env(safe-area-inset-bottom));word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* hero */
.hero{background:var(--navy);color:#fff;padding:28px 0 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:420px;height:420px;right:-200px;top:-200px;border-radius:50%;background:radial-gradient(circle,rgba(31,182,166,.35),transparent 65%)}
.org{font-size:13px;font-weight:700;color:#cfe9e6;display:flex;align-items:center;gap:8px}
.org i{width:8px;height:8px;border-radius:50%;background:var(--teal2)}
.hero h1{font-size:28px;line-height:1.25;font-weight:900;letter-spacing:-.5px;margin:12px 0 6px}
.hero h1 em{font-style:normal;color:var(--teal2)}
.hero p{font-size:14px;color:#b9c6d6}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;position:relative;z-index:1}
.apps a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;background:#fff;color:var(--navy)}
.apps a.alt{background:transparent;color:#fff;border:1.5px solid #3a5878}
.apps a.wide{grid-column:1/-1}

/* sticky nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(244,247,250,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.nav-in{display:flex;flex-wrap:wrap;gap:6px}
.nav::after{content:"";position:absolute;top:0;right:0;bottom:0;width:36px;background:linear-gradient(to right,rgba(244,247,250,0),#f4f7fa 80%);pointer-events:none;opacity:0;transition:opacity .15s}
.nav.more::after{opacity:1}
.nav a{flex:none;text-decoration:none;font-size:14px;font-weight:700;padding:8px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--navy);white-space:nowrap}
.nav a.done{background:var(--tl);border-color:var(--teal);color:var(--teal)}

/* sections */
section{padding:22px 0 4px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.badge{background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:3px 10px;border-radius:6px;flex:none}
.sec-h h2{font-size:19px;font-weight:900;line-height:1.3;color:var(--navy)}
.time{margin-left:auto;font-size:13px;font-weight:700;color:var(--teal);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.desc{font-size:15px;color:var(--sub);margin-bottom:12px}
.lbl{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:6px;display:block}
.box{background:var(--bg);border-left:4px solid var(--teal);border-radius:8px;padding:12px 14px;font-size:15px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.box.data{border-left-color:#9fb0c2;background:#fafbfd;font-size:14px}
details{margin-top:10px}
summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--navy);list-style:none;display:flex;align-items:center;gap:6px;min-height:40px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--teal);transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.copy{appearance:none;border:0;font-family:inherit;font-size:15px;font-weight:700;min-height:48px;padding:0 16px;border-radius:12px;cursor:pointer;background:var(--teal);color:#fff;flex:1 1 100%}
button.copy.sub{background:#fff;color:var(--navy);border:1.5px solid var(--line);flex:1 1 40%}
button.copy:active{transform:scale(.98)}
.ok{font-size:14px;color:var(--sub);margin-top:10px}
.ok b{color:var(--teal)}
.dev{display:grid;gap:6px;margin-top:10px}
.dev div{font-size:14px;background:var(--bg);border-radius:10px;padding:9px 12px}
.dev b{color:var(--navy);margin-right:6px}
.done-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:15px;font-weight:700;color:var(--navy)}
.done-row input{width:22px;height:22px;accent-color:var(--teal)}
.formula{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.formula div{border:1.5px solid var(--teal);border-radius:12px;padding:10px;text-align:center;background:#fff}
.formula b{display:block;font-size:17px;color:var(--teal)}
.formula span{font-size:13px;color:var(--sub)}
.rule{background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;font-size:14px}
.rule b{color:var(--teal2);display:block;margin-bottom:4px;font-size:15px}
.rule ol{padding-left:18px}
.img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin-top:10px;display:block}
.files a{display:flex;align-items:center;gap:12px;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:60px}
.files .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex:none}
.files .x{background:#1f7a4d}.files .w{background:#2b5797}.files .p{background:#c0392b}.files .t{background:#55657a}
.files strong{display:block;font-size:15px;color:var(--navy)}
.files small{font-size:13px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{appearance:none;font-family:inherit;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;min-height:42px}
.chips button:active{background:var(--tl)}
.kw-h{font-size:14px;font-weight:900;color:var(--navy);margin:14px 0 8px}
.kw-h:first-child{margin-top:0}
.sc-pick{font-size:14px;color:var(--sub);margin-bottom:12px}
.memo{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:16px;resize:vertical}
footer{text-align:center;font-size:12px;color:#8a99ab;padding:28px 16px 8px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
.bar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 56px;gap:8px}
.bar a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none}
.bar .g1{background:var(--navy);color:#fff}
.bar .g2{background:var(--tl);color:var(--navy)}
.bar .top{background:#fff;border:1.5px solid var(--line);color:var(--navy);font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-size:15px;font-weight:700;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40;width:max-content;max-width:calc(100vw - 32px);text-align:center;word-break:keep-all}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:640px){.hero h1{font-size:34px}button.copy{flex:1 1 auto}.formula{grid-template-columns:repeat(4,1fr)}}
.bld label{display:block;margin-top:12px}
.bld .bt{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;color:var(--navy)}
.bld .bt i{font-style:normal;font-size:12px;font-weight:800;color:#fff;background:var(--teal);padding:2px 8px;border-radius:6px}
.bld .bt i.r{background:#b4483e}
.bld small{display:block;font-size:13px;color:#5b6b7e;margin:2px 0 6px}
.bld input,.bld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--ink);background:#fff}
.bld textarea{min-height:84px;resize:vertical}
.bld input:focus,.bld textarea:focus{outline:none;border-color:var(--teal)}
.bld .pv{margin-top:14px}
.bld .row2{display:flex;gap:8px;margin-top:10px}
.bld .row2 button{flex:1;appearance:none;font-family:inherit;font-size:14px;font-weight:700;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
</style>
</head>

async function copyText(t){

}

function bVal(k){const el=bIn.find(x=>x.dataset.b===k);return el?el.value.trim():''}
function jo(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+a+'('+b+')';return w+((c-0xAC00)%28?a:b)}
/* 역할 칸에 '너는 ~야'까지 써도 '너는 너는 ~야야'가 되지 않게 앞뒤를 정리 */
function roleLine(r){
  r=r.replace(/^너는\s*/,'').replace(/[.!]+$/,'').replace(/(이야|입니다|이다)$/,'').trim();
  const p=r.charCodeAt(r.length-2);
  if(/야$/.test(r) && p>=0xAC00 && p<=0xD7A3 && (p-0xAC00)%28===0) r=r.slice(0,-1);
  if(!r) return '';
  const c=r.charCodeAt(r.length-1);
  if(c<0xAC00||c>0xD7A3) return `너는 ${r}(이)야.`;
  return `너는 ${r}${(c-0xAC00)%28?'이야':'야'}.`;
}
function bBuild(){
  const v=k=>bVal(k); const L=[];

}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>항목번호 변환기</title>
<!--
  ▶ 8교시 예제 파일 ② 항목번호 변환기
  - AI가 준 글(마크다운: #, ##, ###, -, 1.)을 붙여넣으면
    공공문서 항목번호 체계 1. → 가. → 1) → 가) → (1) → (가) 와 공백 들여쓰기(0/2/4/6/8/10칸)로 바꿉니다.
  - 결과를 복사해 한글 계획안 템플릿에 붙여넣으면 됩니다. AI·서버 없음.
  - 수정 실습: "여기를 바꿔보세요" 표시(들여쓰기 칸 수, 색)를 고쳐 보세요.
-->
<style>
  :root{--navy:#1F3A5F;--accent:#2B6CB0;--bg:#F6F8FB;--line:#D9E0E8;--soft:#EEF2F7;--ink:#1D2430;--mute:#5F6B7A} /* ← 여기를 바꿔보세요 */
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--navy);color:#fff;padding:16px 20px}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;font-size:13px;opacity:.85}
  main{max-width:1100px;margin:0 auto;padding:16px 20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h2{margin:0 0 8px;font-size:15px;color:var(--navy)}
  textarea{width:100%;height:420px;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:Consolas,"맑은 고딕",monospace;font-size:14px;line-height:1.6;resize:vertical;white-space:pre}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  button{padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tip{font-size:13px;color:var(--mute);margin:8px 0 0}
  label{font-size:13px;color:var(--mute)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.3s}.toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>항목번호 변환기</h1><p>마크다운 → 1. / 가. / 1) / 가) / (1) / (가) + 공백 들여쓰기</p></header>
<main>
  <div class="grid">
    <div class="card">
      <h2>입력 (AI가 준 글)</h2>
      <textarea id="src" spellcheck="false"></textarea>
      <div class="bar">
        <label><input type="checkbox" id="keepBlank" checked> 항목 사이 빈 줄 유지</label>
        <label><input type="checkbox" id="stripBold" checked> **굵게** 표시 제거</label>
      </div>
      <p class="tip">규칙: <code>#</code>=1. &nbsp;<code>##</code>=가. &nbsp;<code>###</code>=1) &nbsp;<code>####</code>=가) &nbsp;<code>-</code>/<code>*</code>=현재 수준의 다음 단계 &nbsp;<code>1.</code>로 시작하는 줄=1. &nbsp; 들여쓴 <code>-</code>는 들여쓴 만큼 더 깊게</p>
    </div>
    <div class="card">
      <h2>출력 (한글에 붙여넣기)</h2>
      <textarea id="out" readonly></textarea>
      <div class="bar">
        <button class="primary" id="copy">결과 복사</button>
        <button id="sample">예시 넣기</button>
        <button id="clear">지우기</button>
      </div>
      <p class="tip">붙여넣은 뒤 본문 스타일(맑은 고딕 11pt, 160%)만 적용하면 끝. 번호를 손으로 고칠 일이 없습니다.</p>
    </div>
  </div>
</main>
<div class="toast" id="toast">복사되었습니다</div>
<script>
// ← 여기를 바꿔보세요: 수준별 들여쓰기 칸 수 (센터 양식 메모 기준 0/2/4/6/8/10)
const INDENT = [0, 2, 4, 6, 8, 10];
const HANGUL = '가나다라마바사아자차카타파하';
function label(level, n){          // level 0..5, n = 1부터
  switch(level){
    case 0: return `${n}.`;
    case 1: return `${HANGUL[(n-1)%14]}.`;
    case 2: return `${n})`;
    case 3: return `${HANGUL[(n-1)%14]})`;
    case 4: return `(${n})`;
    default: return `(${HANGUL[(n-1)%14]})`;
  }
}
function convert(text){
  const keepBlank = document.getElementById('keepBlank').checked, stripBold = document.getElementById('stripBold').checked;
  const counters = [0,0,0,0,0,0];
  let lastHeading = -1;                          // 마지막 # 수준 (불릿의 기준)
  const out = [];
  text.replace(/\r/g,'').split('\n').forEach(raw => {
    let line = raw.replace(/\t/g,'    ');
    if (stripBold) line = line.replace(/\*\*(.+?)\*\*/g,'$1');
    if (!line.trim()){ if (keepBlank) out.push(''); return; }
    let level = null, body = line.trim();
    let m;
    if ((m = body.match(/^(#{1,6})\s+(.*)$/))) { level = m[1].length - 1; body = m[2]; lastHeading = level; }
    else if ((m = line.match(/^(\s*)[-*•]\s+(.*)$/))) { const depth = Math.floor(m[1].length / 2); level = Math.min(5, lastHeading + 1 + depth); body = m[2]; }
    else if ((m = body.match(/^\d+[.)]\s+(.*)$/)) && lastHeading < 0) { level = 0; body = m[1]; lastHeading = 0; }
    else if ((m = body.match(/^\d+[.)]\s+(.*)$/))) { level = Math.min(5, lastHeading + 1); body = m[1]; }
    if (level === null){ out.push(' '.repeat(INDENT[Math.min(5, lastHeading + 1)]) + body); return; }  // 본문 문장: 다음 수준 들여쓰기
    counters[level]++; for (let i = level + 1; i < 6; i++) counters[i] = 0;
    out.push(' '.repeat(INDENT[level]) + label(level, counters[level]) + ' ' + body);
  });
  return out.join('\n');
}
const $src = document.getElementById('src'), $out = document.getElementById('out');
function run(){ $out.value = convert($src.value); }
$src.addEventListener('input', run);
document.querySelectorAll('#keepBlank,#stripBold').forEach(el => el.addEventListener('change', run));
document.getElementById('copy').onclick = () => navigator.clipboard.writeText($out.value).then(() => { const t = document.getElementById('toast'); t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1400); });
document.getElementById('clear').onclick = () => { $src.value = ''; run(); };
document.getElementById('sample').onclick = () => { $src.value = `# 필요성
- 원주시의 2022년 자살률은 인구 10만 명당 25.7명으로 전국 평균보다 높다.
- 지역사회가 함께 참여하는 생명존중 문화 조성이 필요하다.

# 목적
- 숲길 걷기를 통해 생명의 소중함을 공유하고 자살예방센터를 홍보한다.

# 사업 내용
## 대상
- 원주시민 200명 내외
## 프로그램
- 준비체조
  - 활동 시작 전 몸풀기
- O/X 퀴즈
- 생명의 나무
  - 생명지킴이 서약
  - 위로 메시지 카드 걸기

# 기대효과
- 지역사회 내 생명존중 문화 확산
- 자살에 대한 편견 해소`; run(); };
document.getElementById('sample').click();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>AI 활용 자가 진단</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: one question at a time, big tap targets, progress bar; result = level card + "오늘 볼 곳" */
:root{
  --bg:#f6f7f4; --surface:#ffffff; --fg:#1b2430; --muted:#5b6673; --line:#d9dee3;
  --accent:#1f3864; --accent-ink:#ffffff; --accent-soft:#e6ecf5; --amber:#b8651b; --amber-soft:#fbefe2; --ok:#2e7d4f; --ok-soft:#e6f3ea;
  --font:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a22; --surface:#1c2430; --fg:#e8ecf1; --muted:#9aa6b4; --line:#2f3a48;
  --accent:#8fb0e6; --accent-ink:#0f1a2c; --accent-soft:#223049; --amber:#e8a05a; --amber-soft:#3a2a18; --ok:#6fcf97; --ok-soft:#1f3328; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a22; --surface:#1c2430; --fg:#e8ecf1; --muted:#9aa6b4; --line:#2f3a48;
  --accent:#8fb0e6; --accent-ink:#0f1a2c; --accent-soft:#223049; --amber:#e8a05a; --amber-soft:#3a2a18; --ok:#6fcf97; --ok-soft:#1f3328; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:560px;margin:0 auto}
header{padding-block:24px 10px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-weight:900;font-size:clamp(1.4rem,5vw,1.9rem);margin:.2em 0 .1em;line-height:1.25;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:.95rem}
.progress{height:6px;background:var(--line);border-radius:999px;margin:14px 0 18px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px}
.qn{font-size:.8rem;color:var(--accent);font-weight:700;letter-spacing:.04em}
.q{font-size:1.15rem;font-weight:700;margin:6px 0 14px;line-height:1.4;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:14px 14px;font-size:1rem;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt b{flex:0 0 1.6em;height:1.6em;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav{display:flex;justify-content:space-between;margin-top:14px}
button.ghost{font:inherit;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:8px 4px;font-size:.9rem}
button.primary{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:1rem}
.result{display:grid;gap:14px}
.level{border-radius:12px;padding:18px 16px;border:1px solid var(--line);background:var(--surface)}
.level .tag{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:6px}
.level h2{margin:0 0 6px;font-size:1.35rem;line-height:1.3}
.level p{margin:0;color:var(--muted)}
.score{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted);margin-top:8px}
.meter{display:flex;gap:4px;margin-top:10px}
.meter span{flex:1;height:10px;border-radius:3px;background:var(--line)}
.meter span.on{background:var(--accent)}
.focus{background:var(--amber-soft);border-radius:12px;padding:14px 16px}
.focus h3{margin:0 0 6px;font-size:1rem;color:var(--amber)}
.focus ul{margin:0;padding-left:1.2em}
.focus li{margin:4px 0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.tip{font-size:.82rem;color:var(--muted)}
.hands{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:.95rem}
.hands b{color:var(--accent)}
footer{margin-top:24px;font-size:.78rem;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">한국전기공사협회 ISC 실무위원회 · 워밍업</div>
  <h1>나는 AI를 얼마나 쓰고 있을까?</h1>
  <p class="lead">8문항 · 90초. 솔직하게 고르면 됩니다. 점수는 어디에도 저장되지 않아요.</p>
</header>

<div class="progress" aria-hidden="true"><i id="bar"></i></div>

<section id="quiz" class="card" aria-live="polite">
  <div class="qn" id="qn">1 / 8</div>
  <div class="q" id="qtext"></div>
  <div class="opts" id="opts"></div>
  <div class="nav">
    <button class="ghost" id="back" type="button">← 이전</button>
    <span class="tip">누르면 바로 다음 문항</span>
  </div>
</section>

<section id="result" class="result" hidden>
  <div class="level" id="level"></div>
  <div class="focus" id="focus"></div>
  <div class="hands" id="hands"></div>
  <div class="bar">
    <button class="primary" id="again" type="button">다시 하기</button>
    <a class="tip" style="align-self:center" href="isc-prompt-hub.html">프롬프트 허브 열기 →</a>
  </div>
</section>

<footer>한국AI평생교육협회 · 강사 정민경 · 2026. 10. 27. 생성형 AI로 사무 실무 빠르게 끝내기</footer>
</div>

<script>
var Q=[
 {q:"ChatGPT, Gemini, Claude 같은 생성형 AI를 써 본 적이 있나요?",
  o:["아직 없다","한두 번 열어 봤다","가끔 쓴다(월 몇 번)","거의 매주 쓴다"]},
 {q:"업무 문서(회의록·공문·안내문)를 AI로 초안 잡아 본 적은?",
  o:["없다","개인적인 글만 써 봤다","한두 번 해 봤다","자주 한다"]},
 {q:"AI에게 부탁할 때 보통 어떻게 쓰나요?",
  o:["한 줄로 '~해줘'","무엇을 원하는지 조금 설명한다","역할·조건·형식까지 적는다","템플릿을 만들어 두고 쓴다"]},
 {q:"AI 결과가 마음에 안 들면?",
  o:["포기하거나 직접 고친다","처음부터 다시 물어본다","같은 대화에서 이어서 고쳐 달라고 한다","무엇을 바꿀지 콕 집어 말한다"]},
 {q:"AI가 틀린 사실(숫자·날짜·법령)을 말한 적이 있다는 걸 알고 있나요?",
  o:["몰랐다","들어는 봤다","안다, 그래서 가끔 확인한다","안다, 항상 원문과 대조한다"]},
 {q:"개인정보나 내부 자료를 AI에 넣는 것에 대해?",
  o:["생각해 본 적 없다","조심해야 한다는 건 안다","이름·금액은 빼고 넣는다","팀 원칙이 있고 지킨다"]},
 {q:"회의 녹음을 글로 바꿔 본 적은(클로바노트·갤럭시 녹음 등)?",
  o:["없다","있다는 건 안다","한두 번 해 봤다","자주 쓴다"]},
 {q:"팀원에게 \"AI로 초안 잡아 와\"라고 지시해 본 적은?",
  o:["없다","생각만 해 봤다","막연하게 말해 봤다","형식·기한·주의점까지 말해 봤다"]}
];
var LV=[
 {min:0,max:8,tag:"처음",color:"var(--amber)",bg:"var(--amber-soft)",title:"이제 시작하는 단계",
  desc:"오늘은 '따라 하기'만 하셔도 충분합니다. 템플릿 01 하나만 들고 가셔도 회의록 한 장이 나옵니다.",
  focus:["프롬프트 공식 네 칸 (역할·목적·조건·형식)","템플릿 01: 회의 메모 → 회의록","개인정보는 넣지 않는다 — 이름은 직위로"],
  hand:"처음 단계"},
 {min:9,max:16,tag:"써본 적 있음",color:"var(--accent)",bg:"var(--accent-soft)",title:"써 봤지만 업무에는 아직",
  desc:"오늘 바뀌는 건 '질문하는 방식'입니다. 조건을 주면 결과가 달라지는 걸 눈으로 확인하세요.",
  focus:["나쁜 예 → 좋은 예: 한 줄만 바꿔도 달라진다","템플릿 04·05: 공문 초안과 어투 조정","이어서 고치기 — 새 채팅 열지 말 것"],
  hand:"써본 적 있음"},
 {min:17,max:24,tag:"업무에 쓰는 중",color:"var(--ok)",bg:"var(--ok-soft)",title:"이미 업무에 쓰고 있는 단계",
  desc:"오늘은 '검토하고 지시하는 사람'의 관점으로 보세요. 팀에 퍼뜨릴 기준을 가져가시면 됩니다.",
  focus:["결과물 검토 5기준 (사실·표현·형식·누락·보안)","템플릿 09·10: 자가 점검, 팀원 지시","우리 팀 AI 사용 원칙 3줄"],
  hand:"업무에 쓰는 중"}
];
var ans=[], i=0;
var qn=document.getElementById('qn'), qt=document.getElementById('qtext'), opts=document.getElementById('opts'), bar=document.getElementById('bar');
function render(){
  qn.textContent=(i+1)+' / '+Q.length; qt.textContent=Q[i].q; opts.innerHTML='';
  Q[i].o.forEach(function(t,k){
    var b=document.createElement('button'); b.type='button'; b.className='opt';
    b.innerHTML='<b>'+(k+1)+'</b><span></span>'; b.lastChild.textContent=t;
    if(ans[i]===k) b.style.borderColor='var(--accent)';
    b.addEventListener('click',function(){ans[i]=k; if(i<Q.length-1){i++;render();}else{finish();}});
    opts.appendChild(b);
  });
  bar.style.width=Math.round(i/Q.length*100)+'%';
  document.getElementById('back').style.visibility=i?'visible':'hidden';
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  var s=ans.reduce(function(a,b){return a+b;},0);
  var lv=LV.filter(function(l){return s>=l.min&&s<=l.max;})[0];
  bar.style.width='100%';
  document.getElementById('quiz').hidden=true; var r=document.getElementById('result'); r.hidden=false;
  var meter='<div class="meter">'+Array.from({length:24},function(_,k){return '<span class="'+(k<s?'on':'')+'"></span>';}).join('')+'</div>';
  document.getElementById('level').innerHTML='<span class="tag" style="background:'+lv.bg+';color:'+lv.color+'">'+lv.tag+'</span><h2>'+lv.title+'</h2><p>'+lv.desc+'</p>'+meter+'<div class="score">점수 '+s+' / 24</div>';
  document.getElementById('focus').innerHTML='<h3>오늘 이 세 가지만 챙기세요</h3><ul>'+lv.focus.map(function(f){return '<li>'+f+'</li>';}).join('')+'</ul>';
  document.getElementById('hands').innerHTML='강사가 물으면 손 들어 주세요: <b>"'+lv.hand+'"</b>';
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('back').addEventListener('click',function(){if(i>0){i--;render();}});
document.getElementById('again').addEventListener('click',function(){ans=[];i=0;document.getElementById('result').hidden=true;document.getElementById('quiz').hidden=false;render();});
render();
</script>
</body>
</html>

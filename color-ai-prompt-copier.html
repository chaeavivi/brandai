<html lang="ko">
<head>

<style>

:root{
  --bg:#f6f3f8; --fg:#2a2435; --muted:#7a7287; --card:#ffffff; --line:#e3dde9;
  --accent:#8b7bb5; --accent-deep:#6f5fa0; --ok:#2e9e6b;
  --font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17141d; --fg:#f1edf5; --muted:#a79fb3; --card:#221d2b; --line:#36303f; --accent:#b4a5df; --accent-deep:#9b8ad0; --ok:#5fc996; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#17141d; --fg:#f1edf5; --muted:#a79fb3; --card:#221d2b; --line:#36303f; --accent:#b4a5df; --accent-deep:#9b8ad0; --ok:#5fc996; color-scheme:dark }

body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header h1{font-size:1.7rem;font-weight:900;margin:0;line-height:1.25;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);font-size:1.05rem}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;font-size:.95rem;line-height:1.35}
.steps b{display:block;font-size:1.3rem;color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{border:3px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:14px 6px;font:700 1.15rem var(--font);cursor:pointer;line-height:1.25}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.tab:focus-visible,.gender button:focus-visible,.copy:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gender button{border:3px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:12px;font:700 1.15rem var(--font);cursor:pointer}
.gender button[aria-pressed="true"]{border-color:var(--accent-deep);color:var(--accent-deep);background:color-mix(in srgb,var(--accent) 15%,var(--card))}
.gender[hidden]{display:none}
.copy{border:0;background:var(--accent-deep);color:#fff;border-radius:20px;padding:24px;font:900 1.7rem var(--font);cursor:pointer;width:100%;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.copy.done{background:var(--ok)}
.copy:active{transform:scale(.98)}
.hint{text-align:center;color:var(--muted);font-size:1rem;margin:-6px 0 0}
.preview{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.preview h2{margin:0 0 8px;font-size:1.05rem;color:var(--muted);font-weight:700}
textarea{width:100%;box-sizing:border-box;min-height:220px;border:1px solid var(--line);border-radius:12px;padding:12px;font:400 1rem/1.6 var(--font);color:var(--fg);background:var(--bg);resize:vertical}
footer{text-align:center;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.copy{transition:none}}

<div class="app">

    <div><b>1</b>카카오톡 ChatGPT에<br>내 사진 3~5장 첨부</div>

    <div><b>3</b>입력창에<br>붙여넣기 → 전송</div>
  </div>

    <button class="tab" role="tab" data-k="id" aria-selected="true">증명사진</button>
    <button class="tab" role="tab" data-k="profile" aria-selected="false">프로필 사진</button>
    <button class="tab" role="tab" data-k="avatar" aria-selected="false">캐릭터 아바타</button>
  </div>

    <button data-g="f" aria-pressed="true">여성</button>
    <button data-g="m" aria-pressed="false">남성</button>
  </div>

  <button class="copy" id="copy">📋 복사하기</button>
  <p class="hint" id="hint">복사 후 카카오톡 ChatGPT 입력창을 길게 눌러 "붙여넣기"</p>

  <section class="preview">
    <h2 id="ptitle">프롬프트 내용</h2>
    <textarea id="box" readonly aria-label="프롬프트 내용"></textarea>
  </section>

  <footer>ⓒ 2026 채아힐링센터 · 컬러 AI 테라피</footer>
</div>

const NAMES={id:"증명사진",profile:"프로필 사진",avatar:"캐릭터 아바타"};
let kind="id", g="f";
const box=document.getElementById("box"), copyBtn=document.getElementById("copy"),
      genderBox=document.getElementById("gender"), ptitle=document.getElementById("ptitle");

function key(){ return kind==="avatar" ? "avatar" : `${kind}_${g}`; }
function render(){
  genderBox.hidden = (kind==="avatar");
  box.value = P[key()];
  ptitle.textContent = `${NAMES[kind]}${kind==="avatar"?"":" · "+(g==="f"?"여성":"남성")} 프롬프트`;
  copyBtn.classList.remove("done"); copyBtn.textContent="📋 복사하기";
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected","false"));
  t.setAttribute("aria-selected","true"); kind=t.dataset.k; render();
}));
genderBox.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
  genderBox.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); g=b.dataset.g; render();
}));
copyBtn.addEventListener("click",async()=>{
  const text=box.value;
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){}
  if(!ok){ try{ box.removeAttribute("readonly"); box.focus(); box.select(); box.setSelectionRange(0,text.length); ok=document.execCommand("copy"); box.setAttribute("readonly",""); }catch(e){} }
  if(ok){ copyBtn.classList.add("done"); copyBtn.textContent="✅ 복사 완료!"; }
  else { copyBtn.textContent="아래 글을 길게 눌러 복사하세요"; box.focus(); box.select(); }
});
try{ const saved=localStorage.getItem("pc-g"); if(saved==="m"){g="m"; genderBox.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.g==="m"?"true":"false"));} }catch(e){}
genderBox.addEventListener("click",()=>{ try{ localStorage.setItem("pc-g",g);}catch(e){} });
render();
</script>
